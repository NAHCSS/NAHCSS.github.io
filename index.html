<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NAHCSS</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0f0f0f;
      color: #f5f5f5;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px;
    }

    main {
      max-width: 560px;
    }

    h1 {
      font-size: 2.5rem;
      margin-bottom: 12px;
      letter-spacing: -0.02em;
    }

    p {
      color: #a3a3a3;
      font-size: 1.05rem;
      line-height: 1.6;
      margin-bottom: 24px;
    }

    a {
      display: inline-block;
      padding: 10px 20px;
      background: #f5f5f5;
      color: #0f0f0f;
      text-decoration: none;
      border-radius: 6px;
      font-weight: 600;
      transition: opacity 0.2s ease;
    }

    a:hover {
      opacity: 0.85;
    }

    footer {
      margin-top: 40px;
      font-size: 0.85rem;
      color: #555;
    }
  </style>
</head>
<body>
  <main>
    <h1>Hello, I'm NAHCSS</h1>
    <p>Welcome to my corner of the internet. This page is a work in progress — more coming soon.</p>
    <a href="https://github.com/NAHCSS">View my GitHub</a>
    <footer>&copy; 2026 NAHCSS. Built with GitHub Pages.</footer>
  </main>
</body>
</html>
